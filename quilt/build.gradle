// Quilt Loader runs the output of the Fabric toolchain, and there is no Quilt Standard Libraries
// release for Minecraft 26.2, so this module builds with Loom against the Fabric sources and
// ships Quilt's own metadata alongside them.
plugins {
    id 'net.fabricmc.fabric-loom'
}

loom {
    accessWidenerPath = rootProject.file('common/src/main/resources/bountiful.accesswidener')
}

// The Quilt build is the Fabric build with an extra manifest: share the sources outright rather
// than keeping a second copy of them in step.
sourceSets.main.java.srcDir rootProject.file('fabric/src/main/java')
sourceSets.main.kotlin.srcDir rootProject.file('fabric/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('fabric/src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Quilt Loader implements the Fabric Loader API — that is how Mod Menu looks up entrypoints
    // under Quilt. fabric-loader is here for those interfaces and for Mixin, nothing else.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_language_kotlin_version}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
