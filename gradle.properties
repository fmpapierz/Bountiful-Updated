org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ForgeGradle hands its dev run one directory per source set, so FML sees the resources folder
# as the mod file and never scans the classes folder for @Mod. Merging them is what the Forge
# MDK does, and is what makes `:forge:runClient` actually construct the mod.
net.minecraftforge.gradle.merge-source-sets=false

# Minecraft 26.x requires Java 25 to run Gradle and to launch the game.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
# Mixin tops out at the JAVA_21 compatibility level, so every module emits Java 21 bytecode.
# Java 21 class files load fine on the Java 25 runtime that Minecraft 26.2 ships with.
java_version=21
# The Java runtime Minecraft 26.2 itself requires, which is what the manifests declare.
java_runtime_version=25

mod_id=bountiful
mod_name=Bountiful
mod_version=8.0.0
mod_license=LGPL-3.0
mod_authors=Ejektaflex
mod_description=Bountiful adds bounty boards to the world.
mod_group_id=io.ejekta.bountiful
mod_homepage=https://github.com/fmpapierz/Bountiful-Updated
mod_issues=https://github.com/fmpapierz/Bountiful-Updated/issues

# Kotlin. The mod is written in Kotlin and bundles its own runtime on Forge and NeoForge,
# where no Kotlin language adapter exists for 26.2.
kotlin_version=2.4.20
kotlinx_serialization_version=1.11.0

# Fabric
fabric_loom_version=1.17.20
fabric_loader_version=0.19.5
# 0.19.3 is the oldest loader that supports Minecraft 26.2, so that is the published floor.
fabric_loader_version_range=>=0.19.3
fabric_api_version=0.160.0+26.2
fabric_language_kotlin_version=1.14.1+kotlin.2.4.20

# Quilt (Quilt Loader runs the Fabric toolchain output)
quilt_loader_version=0.30.1

# Mod Menu drives the config-screen button on Fabric and Quilt
modmenu_version=20.0.2

# NeoForge
moddevgradle_version=2.0.147
neoforge_version=26.2.0.87
neoforge_version_range=[26.2,)

# Forge
forgegradle_version=7.0.40
forge_version=65.1.3
forge_version_range=[65,)
