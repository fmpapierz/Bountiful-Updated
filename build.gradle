plugins {
    id 'java'
    id 'idea'
    // Declared here (versions come from settings.gradle) so the subprojects below can apply them.
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

    version = "${mod_version}+${minecraft_version}"
    group = mod_group_id
    base.archivesName = "Bountiful-${it.name}"

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(java_version)
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(java_version)
            // The vendored Kambrik, Percale and Kudzu sources implement kotlinx.serialization
            // interfaces that are marked internal/experimental, which is exactly what a
            // DynamicOps bridge has to do.
            freeCompilerArgs.addAll(
                    '-Xjvm-default=all',
                    '-opt-in=kotlin.RequiresOptIn',
                    '-opt-in=kotlinx.serialization.InternalSerializationApi',
                    '-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
                    '-opt-in=kotlinx.serialization.SealedSerializationApi',
            )
        }
    }

    // javac targeting Java 21 makes Gradle assume this module can only consume Java 21 libraries,
    // and every Minecraft 26.2 artifact is built for Java 25. What matters at runtime is the JVM,
    // which is 25, so declare that; the bytecode we emit stays at 21 for Mixin.
    [configurations.compileClasspath, configurations.runtimeClasspath].each { configuration ->
        configuration.attributes.attribute(
                org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }

    repositories {
        mavenCentral()
        maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    }

    // The shared module. Everything that is not a loader entrypoint lives here, including the
    // vendored Kambrik and Percale sources that used to be separate library mods.
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.kotlin.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:${kotlinx_serialization_version}"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinx_serialization_version}"
    }

    processResources {
        def properties = [
                mod_id         : mod_id,
                mod_name       : mod_name,
                mod_version    : mod_version,
                version        : project.version,
                mod_license    : mod_license,
                mod_authors    : mod_authors,
                mod_description: mod_description,
                mod_homepage   : mod_homepage,
                mod_issues     : mod_issues,

                minecraft_version: minecraft_version,
                java_version        : java_version,
                java_runtime_version: java_runtime_version,

                minecraft_version_range      : minecraft_version_range,
                fabric_loader_version_range  : fabric_loader_version_range,
                fabric_language_kotlin_version: fabric_language_kotlin_version,
                quilt_loader_version         : quilt_loader_version,
                neoforge_version_range       : neoforge_version_range,
                forge_version_range          : forge_version_range,
        ]

        inputs.properties properties
        filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand properties
        }
    }

    jar {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
        manifest.attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : "${mod_name}-${project.name}",
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Build the four installable loader JARs into build/libs.'
    ['fabric', 'quilt', 'forge', 'neoforge'].each { loader ->
        dependsOn ":${loader}:build"
        from(project(":${loader}").tasks.named('jar'))
    }
    into layout.buildDirectory.dir('libs')
}

tasks.named('build') { dependsOn 'collectJars' }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
